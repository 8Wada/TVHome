plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'app.tvhome.launcher'
    compileSdk 34          // solo para compilar; el SDK 34 es el que ya tienes

    defaultConfig {
        applicationId 'app.tvhome.launcher'
        minSdk 30          // tu TV es Android 11
        targetSdk 30
        versionCode 3
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Firmado con la llave debug para poder instalarlo por adb
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    lint {
        abortOnError false
        checkReleaseBuilds false   // el lint vital se cae con este Gradle; no hace falta
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Versiones que compilan con compileSdk 34
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.tv:tv-material:1.0.0'
    // Reproductor de IPTV (HLS y TS)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
}
